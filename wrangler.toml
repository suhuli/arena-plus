name = "arena-plus"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# 说明：KV 绑定可以直接在 Cloudflare 网页后台 (Settings -> Bindings / Variables) 中添加，
# 变量名称填 ARENA_KV，无需在代码中硬编码 placeholder ID。
# 如果通过本地 wrangler CLI 部署，可取消下方注释并填入真实的 namespace id：
# [[kv_namespaces]]
# binding = "ARENA_KV"
# id = "your-real-kv-id"

[vars]
# MCP 安全访问密钥 (在 Cursor/Claude Desktop 中作为 query ?key=xxx 传递)
MCP_AUTH_KEY = "arena-plus-secret-key"

# 默认期望捕获的目标等级: 'S' (>=90分) 或 'A' (>=75分)
DEFAULT_TARGET_TIER = "S"

# 自动重新抽取会话的最大轮数
AUTO_REROLL_MAX = 5
